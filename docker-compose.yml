version: '3.8'

services:
  app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME} 
    depends_on:
      - mongodb_db

  mongodb_db:
    image: mongo:latest
    container_name: mongodb_db
    ports:
      - "27017:27017"