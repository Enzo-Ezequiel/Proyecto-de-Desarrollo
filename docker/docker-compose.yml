services:
  mongo:
    image: mongo:7.0
    container_name: mongo_db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    image: repositoriodesarrollo:${APP_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fastapi_app
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    env_file:
      - .env

volumes:
  mongo_data:
